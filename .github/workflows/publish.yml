name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout fetches annotated tags as lightweight ones; refetch so the release notes get the tag message
      - name: "Fetch the annotated tag"
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: "Check the plugin version"
        run: |
          grep -Eq "^ \* Version: +${GITHUB_REF_NAME}\$" cms-observer-client.php \
            || { echo "The Version header in cms-observer-client.php doesn't match the tag ${GITHUB_REF_NAME}" >&2; exit 1; }
          grep -Eq "^Stable tag: ${GITHUB_REF_NAME}\$" readme.txt \
            || { echo "The Stable tag in readme.txt doesn't match the tag ${GITHUB_REF_NAME}" >&2; exit 1; }

      # The prefix is the plugin directory, so the ZIP installs under the plugin's slug
      - name: "Build the plugin ZIP"
        run: git archive --format=zip --prefix=cms-observer-client/ -o "cms-observer-client-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      # WordPress.org doesn't allow the Update URI header; the GitHub ZIP keeps it until the slug is ours
      - name: "Build the WordPress.org ZIP"
        run: |
          mkdir build
          git archive --prefix=cms-observer-client/ "${GITHUB_REF_NAME}" | tar -x -C build
          sed -i '/^ \* Update URI:/d' build/cms-observer-client/cms-observer-client.php
          if grep -q 'Update URI' build/cms-observer-client/cms-observer-client.php; then
            echo "The Update URI header is still in the WordPress.org ZIP" >&2
            exit 1
          fi
          (cd build && zip -qr "../cms-observer-client-${GITHUB_REF_NAME}-wordpress-org.zip" cms-observer-client)

      - name: "Create the GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "cms-observer-client-${GITHUB_REF_NAME}.zip" "cms-observer-client-${GITHUB_REF_NAME}-wordpress-org.zip" --verify-tag --notes-from-tag --title "${GITHUB_REF_NAME}"
