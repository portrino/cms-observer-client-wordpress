name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Shares the SVN repository with wordpress-org-assets.yml
concurrency:
  group: wordpress-org-svn

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout fetches annotated tags as lightweight ones; refetch so the release notes get the tag message
      - name: "Fetch the annotated tag"
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: "Check the plugin version"
        run: |
          grep -Eq "^ \* Version: +${GITHUB_REF_NAME}\$" cms-observer-client.php \
            || { echo "The Version header in cms-observer-client.php doesn't match the tag ${GITHUB_REF_NAME}" >&2; exit 1; }
          grep -Eq "^Stable tag: ${GITHUB_REF_NAME}\$" readme.txt \
            || { echo "The Stable tag in readme.txt doesn't match the tag ${GITHUB_REF_NAME}" >&2; exit 1; }

      # The prefix is the plugin directory, so the ZIP installs under the plugin's slug
      - name: "Build the plugin ZIP"
        run: git archive --format=zip --prefix=cms-observer-client/ -o "cms-observer-client-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: "Create the GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "cms-observer-client-${GITHUB_REF_NAME}.zip" --verify-tag --notes-from-tag --title "${GITHUB_REF_NAME}"

      # Deploys the export-ignore filtered tree (.gitattributes) to trunk and tags/<version>
      - name: "Deploy to WordPress.org"
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cms-observer-client
