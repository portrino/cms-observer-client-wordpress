name: WordPress.org assets

on:
  push:
    branches:
      - main
    paths:
      - ".wordpress-org/**"
      - "readme.txt"

permissions:
  contents: read

# Shares the SVN repository with the deploy in publish.yml
concurrency:
  group: wordpress-org-svn

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A version bump reaches main before its tag; publish.yml deploys that readme.txt with the tag
      - name: "Check the stable tag"
        id: stable
        run: |
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          if git ls-remote --exit-code --tags origin "refs/tags/${stable}" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Stable tag ${stable} isn't tagged yet; the release deploys readme.txt and assets"
          fi

      # Updates assets/, trunk/readme.txt and tags/<stable tag>/readme.txt; the plugin code stays as released
      - name: "Update the WordPress.org assets and readme.txt"
        if: steps.stable.outputs.released == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cms-observer-client
          IGNORE_OTHER_FILES: true
