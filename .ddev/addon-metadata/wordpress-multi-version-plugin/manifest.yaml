name: wordpress-multi-version-plugin
repository: portrino/ddev-wordpress-multi-version-plugin
version: 1.0.0
install_date: "2026-11-17T12:47:03+01:00"
project_files:
    - docker-compose.wordpress-setup.yaml
    - .setup/scripts/run
    - .setup/scripts/utils.sh
    - .setup/scripts/write-git-info.sh
    - .setup/scripts/wp-versions-host.sh
    - .setup/docker-compose.zz-project.yaml.example
    - .setup/project.sh.example
    - .setup/templates/index.php
    - commands/host/open
    - commands/host/worktree-init
    - commands/host/worktree-remove
    - apache/wordpress-versions.conf
    - apache/wordpress-versions.rules
    - nginx_full/wordpress-versions.conf
    - commands/web/install
    - commands/web/all
global_files: []
removal_actions:
    - rm -f "${DDEV_APPROOT}/.ddev/config.wordpress-setup.yaml"
    - |
      for file in "${DDEV_APPROOT}"/.ddev/commands/web/*; do
        if grep -q '^## Generated by the wordpress-multi-version-plugin add-on' "$file" 2>/dev/null; then
          rm -f "$file"
        fi
      done
