# One server block per WordPress instance (.Build/<version>), each on its own hostname.
# The rewrites also cover subdirectory multisite installs.
# wp<major><minor>.<project> -> .Build/<major>.<minor>, e.g. wp64 -> .Build/6.4

server {
    listen 80;
    listen 443 ssl;
    server_name ~^wp(?<wp_major>\d)(?<wp_minor>\d+)\..*$;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    root /var/www/html/.Build/$wp_major.$wp_minor;
    index index.php;
    client_max_body_size 100m;
    include /etc/nginx/monitoring.conf;
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    if (!-e $request_filename) {
        rewrite /wp-admin$ $scheme://$host$uri/ permanent;
        rewrite ^(/[^/]+)?(/wp-.*) $2 last;
        rewrite ^(/[^/]+)?(/.*\.php) $2 last;
    }

    location / {
        absolute_redirect off;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
    }
}
